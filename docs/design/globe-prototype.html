<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cipher — globe study</title>
<style>
  :root{
    --ink:#0a0a0c; --paper:#ece6da; --muted:rgba(236,230,218,.46);
    --faint:rgba(236,230,218,.30); --hair:rgba(236,230,218,.13);
    --brass:#bfa273; --serif:Georgia,"Times New Roman",serif;
    --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:radial-gradient(120% 80% at 50% 18%, #14141a 0%, #0b0b0e 52%, #070709 100%);
    color:var(--paper); font-family:var(--sans);
    -webkit-font-smoothing:antialiased; overflow:hidden;
    touch-action:none; user-select:none; -webkit-user-select:none;
  }
  body::after{content:"";position:fixed;inset:0;pointer-events:none;opacity:.035;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 width=%27140%27 height=%27140%27%3E%3Cfilter id=%27n%27%3E%3CfeTurbulence type=%27fractalNoise%27 baseFrequency=%27.9%27 numOctaves=%273%27/%3E%3C/filter%3E%3Crect width=%27100%25%27 height=%27100%25%27 filter=%27url(%23n)%27/%3E%3C/svg%3E")}
  header{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:22px 22px 0}
  .wordmark{font-family:var(--serif);font-size:12px;letter-spacing:.44em;text-transform:uppercase;color:var(--paper);opacity:.92}
  .menu{display:flex;align-items:center;gap:9px;border:1px solid var(--hair);border-radius:999px;
    background:rgba(16,16,20,.35);backdrop-filter:blur(10px);padding:9px 15px;
    font-family:var(--mono);font-size:9px;letter-spacing:.24em;text-transform:uppercase;color:var(--paper);opacity:.85;cursor:pointer}
  .menu svg{opacity:.55}
  main{position:fixed;inset:0;display:grid;place-items:center}
  .stage{position:relative;width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center}
  .copy{text-align:center;padding:0 30px;margin-top:6px}
  .eyebrow{font-family:var(--mono);font-size:8.5px;letter-spacing:.3em;text-transform:uppercase;color:var(--brass);opacity:.85;margin-bottom:14px}
  h1{font-family:var(--serif);font-weight:400;font-size:31px;line-height:1.14;letter-spacing:-.012em;color:var(--paper);text-wrap:balance}
  h1 em{font-style:italic;color:var(--brass)}
  .sub{margin-top:16px;font-size:12.5px;line-height:1.6;color:var(--muted);letter-spacing:.01em;max-width:30ch;margin-left:auto;margin-right:auto}
  @media (min-width:900px){.sub{margin-top:22px;font-size:14.5px;max-width:34ch;margin-left:0}}
  .globe-wrap{position:relative;flex:0 0 auto;margin:6px 0 0}
  canvas{display:block;touch-action:none}
  .readout{font-family:var(--mono);font-size:8px;letter-spacing:.22em;color:rgba(236,230,218,.22);text-align:center;margin-top:2px}
  .hint{font-family:var(--mono);font-size:8.5px;letter-spacing:.28em;text-transform:uppercase;color:var(--faint);text-align:center;margin-top:7px}
  body.picking .zoom{opacity:0;pointer-events:none}
  .zoom{transition:opacity .35s ease;position:absolute;right:-2px;bottom:6px;display:flex;flex-direction:column;gap:10px;z-index:15}
  .zoom button{width:38px;height:38px;border-radius:999px;border:1px solid var(--hair);
    background:rgba(16,16,20,.4);backdrop-filter:blur(8px);color:var(--paper);
    font-family:var(--sans);font-size:17px;line-height:1;opacity:.75;cursor:pointer}
  .cta{position:fixed;left:0;right:0;bottom:0;z-index:15;padding:0 22px 26px;display:flex;flex-direction:column;align-items:center;gap:12px}
  .primary{width:100%;max-width:330px;border:0;border-radius:999px;cursor:pointer;background:var(--paper);color:#0a0a0c;
    font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;padding:16px 18px;
    display:flex;align-items:center;justify-content:center;gap:12px}
  .primary svg{opacity:.7}
  .secondary{font-size:10.5px;color:var(--muted);letter-spacing:.03em}
  .secondary u{text-underline-offset:3px;text-decoration-color:var(--hair)}
  .card{position:fixed;left:18px;right:18px;bottom:112px;z-index:18;border:1px solid var(--hair);border-radius:16px;
    background:rgba(14,14,18,.82);backdrop-filter:blur(18px);padding:16px 18px 17px;display:none}
  .card.on{display:block;animation:rise .45s cubic-bezier(.22,1,.36,1)}
  @keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
  .card .k{font-family:var(--mono);font-size:8px;letter-spacing:.26em;text-transform:uppercase;color:var(--brass);opacity:.8}
  .card .n{font-family:var(--serif);font-size:20px;margin:6px 0 3px}
  .card .c{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;color:var(--muted)}
  .card .row{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
  .card .use{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--paper);opacity:.9}
  .card .x{font-family:var(--mono);font-size:9px;color:var(--muted);cursor:pointer}
  @media (min-width:900px){
    header{padding:34px 48px 0}
    .wordmark{font-size:13px}
    .stage{align-items:flex-start;justify-content:center;padding-left:96px;padding-right:48px}
    .copy{text-align:left;padding:0;max-width:520px;order:1}
    h1{font-size:58px;line-height:1.06}
    .eyebrow{font-size:9.5px;margin-bottom:20px}
    .globe-wrap{position:absolute;right:6%;top:50%;transform:translateY(-52%);order:2}
    .zoom{right:-30px;bottom:12px}
    .hint{position:absolute;left:0;right:0;bottom:34px;margin:0}
    .readout{position:absolute;left:0;right:0;bottom:52px;margin:0}
    .cta{left:96px;right:auto;bottom:96px;padding:0;align-items:flex-start;gap:14px}
    .primary{max-width:none;width:auto;padding:17px 34px}
    .card{left:96px;right:auto;bottom:190px;width:360px}
  }
</style>
</head>
<body>
<header>
  <div class="wordmark">The Cipher</div>
  <button class="menu">Menu
    <svg width="9" height="6" viewBox="0 0 9 6" fill="none"><path d="M1 1l3.5 3.5L8 1" stroke="currentColor" stroke-width="1"/></svg>
  </button>
</header>

<main>
  <div class="stage">
    <div class="copy">
      <div class="eyebrow">A study in time and place</div>
      <h1>Where you stand<br>changes <em>the sky.</em></h1>
      <p class="sub">KP charts, cast to the second, from your exact time and place.</p>
    </div>
    <div class="globe-wrap"><canvas id="c"></canvas><div class="zoom"><button id="in" aria-label="Zoom in">+</button><button id="out" aria-label="Zoom out">−</button></div></div>
    <div class="readout" id="ro">20.0° N &nbsp; 28.0° E</div>
    <div class="hint">Drag &nbsp;·&nbsp; pinch &nbsp;·&nbsp; tap a place</div>
  </div>
</main>

<div class="card" id="card">
  <div class="k" id="ck">Selected place</div>
  <div class="n" id="cn">Ujjain</div>
  <div class="c" id="cc">23.18° N &nbsp; 75.78° E</div>
  <div class="row"><span class="use" id="cu">Use this place →</span><span class="x" id="cx">Close</span></div>
</div>

<div class="cta">
  <button class="primary">Enter the Cipher
    <svg width="15" height="8" viewBox="0 0 15 8" fill="none"><path d="M0 4h13M10 1l3 3-3 3" stroke="currentColor" stroke-width="1"/></svg>
  </button>
  <div class="secondary">Already a member? <u>Sign in</u></div>
</div>

91,-86.74],[-74.59,-86.84],[62.92,-86.94],[-159.57,-87.04],[-22.06,-87.15],[115.44,-87.26],[-107.05,-87.38],[30.46,-87.5],[167.97,-87.63],[-54.52,-87.76],[82.98,-87.91],[-139.51,-88.06],[-2,-88.23],[135.51,-88.42],[-86.99,-88.63],[50.52,-88.88],[-171.97,-89.21],[-34.46,-90]];
const PINS = [
  { n:"Ujjain",   note:"The meridian",   lat:23.18,  lon:75.78 },
  { n:"London",   note:"52° north",      lat:51.51,  lon:-0.13 },
  { n:"New York", note:"West gate",      lat:40.71,  lon:-74.01 },
  { n:"Tokyo",    note:"First light",    lat:35.68,  lon:139.69 }
];

const ro = document.getElementById("ro");
const cv = document.getElementById("c");
const ctx = cv.getContext("2d");
const DPR = Math.min(window.devicePixelRatio || 1, 2);

let W = 0, H = 0, R = 120, cx = 0, cy = 0, compact = true;
let lon0 = 28, lat0 = 20, targetLon = 28, targetLat = 20;
let zoom = 1, targetZoom = 1;
let sel = -1, dragging = false, last = null, lastMove = 0, idle = 0;
let pinch = null;

const INK = "236,230,218";
const BRASS = "191,162,115";

function layout(){
  compact = window.innerWidth < 900;
  W = window.innerWidth; H = window.innerHeight;
  const wrap = cv.parentElement;
  R = compact ? Math.min(W * 0.31, 132) : Math.min(W * 0.20, H * 0.33, 300);
  const size = R * 2.62;
  wrap.style.width = size + "px"; wrap.style.height = size + "px";
  cv.style.width = size + "px"; cv.style.height = size + "px";
  cv.width = size * DPR; cv.height = size * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  cx = size / 2; cy = size / 2;
}

const rad = Math.PI / 180;
function project(lat, lon){
  const p = lat * rad, l = (lon - lon0) * rad, p0 = lat0 * rad;
  const cosc = Math.sin(p0) * Math.sin(p) + Math.cos(p0) * Math.cos(p) * Math.cos(l);
  if (cosc <= 0.001) return null;
  return {
    x: cx + R * zoom * Math.cos(p) * Math.sin(l),
    y: cy - R * zoom * (Math.cos(p0) * Math.sin(p) - Math.sin(p0) * Math.cos(p) * Math.cos(l)),
    d: cosc
  };
}

function graticule(){
  ctx.lineWidth = 1;
  ctx.strokeStyle = `rgba(${INK},0.055)`;
  for (let lat = -75; lat <= 75; lat += 15){
    ctx.beginPath(); let started = false;
    for (let lon = -180; lon <= 180; lon += 3){
      const q = project(lat, lon);
      if (!q){ started = false; continue; }
      started ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); started = true;
    }
    ctx.stroke();
  }
  for (let lon = -180; lon < 180; lon += 15){
    ctx.beginPath(); let started = false;
    for (let lat = -89; lat <= 89; lat += 3){
      const q = project(lat, lon);
      if (!q){ started = false; continue; }
      started ? ctx.lineTo(q.x, q.y) : ctx.moveTo(q.x, q.y); started = true;
    }
    ctx.stroke();
  }
}

function sphere(){
  const r = R * zoom;
  const g = ctx.createRadialGradient(cx - r*0.3, cy - r*0.35, r*0.1, cx, cy, r);
  g.addColorStop(0, "rgba(255,255,255,0.028)");
  g.addColorStop(0.6, "rgba(255,255,255,0.008)");
  g.addColorStop(1, "rgba(0,0,0,0.18)");
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();

  ctx.strokeStyle = `rgba(${INK},0.13)`; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();

  ctx.strokeStyle = `rgba(${INK},0.05)`;
  ctx.beginPath(); ctx.arc(cx, cy, r + r*0.075, 0, Math.PI*2); ctx.stroke();

  // limb shading: a whisper of dimension, no neon
  const limb = ctx.createRadialGradient(cx, cy, r*0.82, cx, cy, r);
  limb.addColorStop(0, "rgba(0,0,0,0)");
  limb.addColorStop(1, "rgba(0,0,0,0.30)");
  ctx.save(); ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.clip();
  ctx.fillStyle = limb; ctx.fillRect(0, 0, W, H); ctx.restore();
}

function dots(){
  const base = compact ? 0.80 : 1.14;
  const r = Math.max(0.55, base * zoom);
  for (let i = 0; i < DOTS.length; i++){
    const q = project(DOTS[i][1], DOTS[i][0]);
    if (!q) continue;
    const limb = Math.max(0, Math.min(1, (q.d - 0.03) / 0.22));
    const a = (compact ? 0.08 + 0.50 * Math.pow(q.d, 1.8) : 0.10 + 0.56 * Math.pow(q.d, 1.8)) * limb;
    if (a < 0.02) continue;
    ctx.fillStyle = "rgba(" + INK + "," + a.toFixed(3) + ")";
    ctx.beginPath(); ctx.arc(q.x, q.y, r * (0.66 + 0.44 * q.d), 0, Math.PI*2); ctx.fill();
  }
}

function pins(t){
  for (let i = 0; i < PINS.length; i++){
    const p = PINS[i], q = project(p.lat, p.lon);
    if (!q || q.d < 0.12) continue;
    const a = 0.45 + 0.55 * q.d;
    const active = i === sel;
    if (active){
      const pulse = (t % 2600) / 2600;
      for (const k of [0, 1]){
        const rr = 6 + (pulse * 26) + k * 9;
        ctx.strokeStyle = `rgba(${BRASS},${(0.22 * (1 - pulse) * (1 - k*0.4)).toFixed(3)})`;
        ctx.lineWidth = 1;
        ctx.beginPath(); ctx.arc(q.x, q.y, rr, 0, Math.PI*2); ctx.stroke();
      }
    }
    ctx.strokeStyle = `rgba(${BRASS},${(a * (active ? 0.95 : 0.55)).toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.arc(q.x, q.y, active ? 6.5 : 5, 0, Math.PI*2); ctx.stroke();
    ctx.fillStyle = `rgba(${BRASS},${(a * (active ? 1 : 0.85)).toFixed(3)})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, active ? 2.4 : 1.9, 0, Math.PI*2); ctx.fill();

    if (q.d < 0.42) continue; // no label on an edge-on pin
    // hairline leader + label (flip inward near the limb)
    const nearLimb = q.x > cx + R*zoom*0.76;
    const dir = nearLimb ? -1 : (q.x > cx ? 1 : -1);
    const lx = q.x + dir * 16, ly = q.y - 13;
    ctx.strokeStyle = `rgba(${INK},${(0.18 * a).toFixed(3)})`;
    ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(q.x + dir*6, q.y - 7); ctx.lineTo(lx, ly); ctx.lineTo(lx + dir*34, ly); ctx.stroke();

    ctx.font = "500 9px ui-monospace,Menlo,monospace";
    ctx.letterSpacing = "1.8px";
    ctx.textAlign = dir > 0 ? "left" : "right";
    ctx.shadowColor = "rgba(6,6,8,0.95)"; ctx.shadowBlur = 10;
    ctx.fillStyle = "rgba(" + INK + "," + (0.74 * a).toFixed(3) + ")";
    ctx.fillText(p.n.toUpperCase(), lx + dir*3, ly - 5);
    ctx.shadowBlur = 0;
  }
  ctx.textAlign = "left";
  ctx.letterSpacing = "0px";
}

function draw(t){
  ctx.clearRect(0, 0, W, H);
  sphere();
  graticule();
  dots();
  pins(t);
}

function step(t){
  if (!dragging){
    idle += 1;
    const settle = Math.abs(targetLon - lon0) > 0.01 || Math.abs(targetLat - lat0) > 0.01;
    lon0 += (targetLon - lon0) * 0.12;
    lat0 += (targetLat - lat0) * 0.12;
    if (!settle && sel < 0 && idle > 40) { lon0 += 0.016; }
  }
  zoom += (targetZoom - zoom) * 0.12;
  const nlat = lat0.toFixed(1), nlon = (((lon0 % 360) + 540) % 360 - 180).toFixed(1);
  ro.textContent = Math.abs(nlat) + "\u00b0 " + (nlat >= 0 ? "N" : "S") + "   " + Math.abs(nlon) + "\u00b0 " + (nlon >= 0 ? "E" : "W");
  draw(t);
  requestAnimationFrame(step);
}

addEventListener("pointerdown", (e) => {
  if (e.pointerType === "touch" && e.isPrimary === false) return;
  dragging = true; idle = 0; last = { x: e.clientX, y: e.clientY }; lastMove = 0;
  cv.setPointerCapture?.(e.pointerId);
});
addEventListener("pointermove", (e) => {
  if (!dragging || !last) return;
  const dx = e.clientX - last.x, dy = e.clientY - last.y;
  last = { x: e.clientX, y: e.clientY };
  lastMove += Math.abs(dx) + Math.abs(dy);
  const k = 0.32 / (zoom * (R / 120));
  targetLon -= dx * k; targetLat += dy * k;
  targetLat = Math.max(-72, Math.min(72, targetLat));
  lon0 += (targetLon - lon0) * 0.55; lat0 += (targetLat - lat0) * 0.55;
});
addEventListener("pointerup", (e) => {
  if (lastMove < 6) {
    // tap: hit-test pins
    let hit = -1, best = 26;
    PINS.forEach((p, i) => {
      const q = project(p.lat, p.lon);
      if (!q) return;
      const d = Math.hypot(q.x + cv.getBoundingClientRect().left - e.clientX, q.y + cv.getBoundingClientRect().top - e.clientY);
      if (d < best) { best = d; hit = i; }
    });
    sel = hit; showCard(hit);
  }
  dragging = false; last = null; idle = 0;
});
addEventListener("wheel", (e) => {
  e.preventDefault();
  targetZoom = Math.max(0.82, Math.min(1.9, targetZoom - e.deltaY * 0.0012));
}, { passive: false });
document.getElementById("in").onclick = () => targetZoom = Math.min(1.9, targetZoom + 0.18);
document.getElementById("out").onclick = () => targetZoom = Math.max(0.82, targetZoom - 0.18);
document.getElementById("cx").onclick = () => { sel = -1; showCard(-1); };
document.getElementById("cu").onclick = () => { sel = -1; showCard(-1); };

function showCard(i){
  const card = document.getElementById("card");
  document.body.classList.toggle("picking", i >= 0);
  if (i < 0) { card.classList.remove("on"); return; }
  const p = PINS[i];
  document.getElementById("ck").textContent = p.note;
  document.getElementById("cn").textContent = p.n;
  document.getElementById("cc").textContent =
    Math.abs(p.lat).toFixed(2) + "° " + (p.lat >= 0 ? "N" : "S") + "   " +
    Math.abs(p.lon).toFixed(2) + "° " + (p.lon >= 0 ? "E" : "W");
  card.classList.add("on");
}

addEventListener("resize", () => { layout(); draw(0); });
layout();
requestAnimationFrame(step);
</script>
